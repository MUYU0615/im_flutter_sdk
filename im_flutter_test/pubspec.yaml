name: im_flutter_test
description: "环信 Flutter SDK 自动化测试桥接端（被测设备 App）。依赖发布版 im_flutter_sdk，承载 WebSocket 桥接与测试脚手架。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 读取 native-auto-test/flutter_config.yaml（通过 assets 软链）。
  yaml: ^3.1.2
  web_socket_channel: ^3.0.3

  # 被测 SDK 入口。Native 端初始化必须走 EMClient facade，避免绕过 Dart 层状态。
  im_flutter_sdk:
    path: ../im_flutter_sdk

  # 平台插件直接通过 interface 提供 JSON bridge 行为。
  im_flutter_sdk_android:
    path: ../im_flutter_sdk_android
  im_flutter_sdk_ios:
    path: ../im_flutter_sdk_ios
  im_flutter_sdk_web:
    path: ../im_flutter_sdk_web

  # 桥接用到 Client / callNativeMethod（ManagerMixin），来自接口包。
  im_flutter_sdk_interface:
    path: ../im_flutter_sdk_interface

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/media/
