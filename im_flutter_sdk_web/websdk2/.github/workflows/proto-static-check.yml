name: Proto Static Check

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  proto-static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Check Generated Proto
        run: npm run proto:check

      - name: Run Platform/Protocol Tests
        run: npm run test:run -- tests/unit/platform tests/unit/protocol
