name: layered-test-gates

on:
  pull_request:
    branches: ['**']
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      run_release_gate:
        description: '是否执行发布前门禁'
        required: false
        default: 'false'

jobs:
  pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      LAYERED_GATE_STRICT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:gate:pr

  nightly-full:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      LAYERED_GATE_STRICT: '1'
      EASEMOB_APPKEY: ${{ secrets.EASEMOB_APPKEY }}
      EASEMOB_USERID: ${{ secrets.EASEMOB_USERID }}
      EASEMOB_TOKEN: ${{ secrets.EASEMOB_TOKEN }}
      EASEMOB_TARGET_ID: ${{ secrets.EASEMOB_TARGET_ID }}
      EASEMOB_USE_FIXED_URLS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - run: npm ci
      - run: npm ci --prefix demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:gate:nightly

  release-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.run_release_gate == 'true'
    runs-on: ubuntu-latest
    env:
      LAYERED_GATE_STRICT: '1'
      EASEMOB_APPKEY: ${{ secrets.EASEMOB_APPKEY }}
      EASEMOB_USERID: ${{ secrets.EASEMOB_USERID }}
      EASEMOB_TOKEN: ${{ secrets.EASEMOB_TOKEN }}
      EASEMOB_TARGET_ID: ${{ secrets.EASEMOB_TARGET_ID }}
      EASEMOB_USE_FIXED_URLS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - run: npm ci
      - run: npm ci --prefix demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:gate:release
