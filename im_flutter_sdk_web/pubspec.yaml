name: im_flutter_sdk_web
description: Web adapter used by the Flutter IM test app.
version: 4.19.0
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  im_flutter_sdk_interface:
    path: ../im_flutter_sdk_interface
  plugin_platform_interface: ^2.1.8
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      web:
        pluginClass: ImFlutterSdkWeb
        fileName: im_flutter_sdk_web.dart
