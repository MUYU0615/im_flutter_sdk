    source_dir: "im_flutter_sdk_web/"
    download_url_template: ""
    docs_url: ""
    versions:
      web-4.23.0:
        version: "4.23.0"
        download_url: ""
        local_artifact_hint: "im_flutter_sdk_web and im_flutter_test/web/vendor"
  hmos:
    artifact: ""
    source_dir: ""
    download_url_template: ""
    docs_url: ""
    versions: {}
  windows:
    artifact: ""
    source_dir: ""
    download_url_template: ""
    docs_url: ""
    versions: {}

api_changes:
  "4.23.0":
    release_note_url: ""
    android:
      added:
        - api: "ChatManager.saveMessage"
          native: "EMChatManager.saveMessage"
          reason: "Android 4.23.0 追平阶段新增 API 示例。"
      changed: {}
      removed: []
    ios:
      added: []
      changed: {}
      removed: []
    web:
      added: []
      changed: {}
      removed: []

api_policy:
  ChatManager.saveMessage:
    introduced:
      android: "4.23.0"
      ios: null
      web: null
    status:
      ios:
        status: "version_gap"
        reason: "iOS 当前目标版本未声明该真实 SDK 能力，暂不覆盖。"
      web:
        status: "version_gap"
        reason: "Web 当前目标版本未声明该真实 SDK 能力，暂不覆盖。"
