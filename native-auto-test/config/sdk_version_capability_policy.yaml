# SDK 版本能力增量账本。
#
# 只记录每个版本新增/变更/移除的 API，不手写维护全量表。
# 工具根据 test_versions 中的当前测试版本，把 baseline 到目标版本的 added/changed/removed
# 累计成当前版本应覆盖 API，再叠加真实 SDK 扫描、wrapper 扫描和 case 结果生成报告。
#
# 新增平台（例如 tablet）时，只需要：
# 1. 在 test_versions.platforms 增加平台当前 SDK 版本。
# 2. 在 sdk_sources 增加该平台 SDK 来源、下载地址、源码目录。
# 3. 在 api_changes 对应版本下记录该平台新增/变更/移除 API。

test_versions:
  baseline_platform: android
  purpose: "当前发版测试版本选择；Android 4.23.0 仅为本次追平基线，不是永久基线。"
  platforms:
    android:
      version: "4.23.0"
      enabled: true
      role: baseline
      source_ref: android-4.23.0
    ios:
      version: "4.23.0"
      enabled: true
      role: target
      source_ref: ios-4.23.0
    web:
      version: "4.23.0"
      enabled: true
      role: target
      source_ref: web-4.23.0
    hmos:
      version: null
      enabled: false
      role: target
      source_ref: null
    windows:
      version: null
      enabled: false
      role: target
      source_ref: null

