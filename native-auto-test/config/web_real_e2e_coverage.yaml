        --target-platform web -q"
      reason: Client.renewToken in real_sdk mode calls the browser WebIM renewToken
        method with a fresh per-user access_token from REST password grant and verifies
        the WebSDK debug event renewToken_success.
    logout:
      real_e2e_status: supported
      tests:
