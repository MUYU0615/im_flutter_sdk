web_real_e2e:
  Client:
    init:
      real_e2e_status: supported
      tests:
      - tests/web_real/test_real_web_chat_smoke.py::test_real_web_send_text_a_to_b
      verified_by: &id001
      - make web-real-e2e ARGS="--run-id web-real-chat-smoke --web-sdk-mode real_sdk
        --headless-startup-wait 60 --startup-timeout 120 --flutter-timeout 180 --
        tests/web_real/test_real_web_chat_smoke.py::test_real_web_send_text_a_to_b
        --target-platform web -q"
      reason: Real Web SDK asset is loaded by im_flutter_test/web/index.html and Client.init
        creates a WebIM connection in real_sdk mode. Verified as part of the real
        Web A/B text-message E2E smoke.
    createAccount:
      real_e2e_status: not_applicable
      tests: []
      verified_by:
      - rg -n "registerUser|renewToken|uploadLog|compressLogs|kickDevice|kickAllDevices|getLoggedInDevices"
        im_flutter_test/web/vendor/easemob/Easemob-chat.js
      - 'make web-real-e2e ARGS="--run-id web-real-client-create-account-green --web-sdk-mode
        real_sdk --headless-startup-wait 60 --startup-timeout 120 --flutter-timeout
        180 -- tests/web_real/test_real_web_client_session.py::test_real_web_client_create_account
        --target-platform web -q" # observed 401 register user need token before removing
        non-stable case'
      reason: Real Web SDK exposes registerUser, but the current test app disables
        open registration and returns 401 "Open registration does not allow, so register
        user need token". User creation for E2E is handled through REST test setup
        instead of browser SDK createAccount.
    login:
      real_e2e_status: supported
      tests:
      - tests/web_real/test_real_web_chat_smoke.py::test_real_web_send_text_a_to_b
      verified_by: *id001
      reason: Real Web SDK login succeeds for webA and webB in real_sdk mode using
        the session credentials before the A/B text-message E2E smoke sends a message.
    loginWithAgoraToken:
      real_e2e_status: supported
      tests:
      - tests/web_real/test_real_web_client_session.py::test_real_web_client_login_and_renew_with_user_access_token
      verified_by:
      - make web-real-e2e ARGS="--run-id web-real-client-token-green --web-sdk-mode
        real_sdk --headless-startup-wait 60 --startup-timeout 120 --flutter-timeout
        180 -- tests/web_real/test_real_web_client_session.py::test_real_web_client_login_and_renew_with_user_access_token
        --target-platform web -q"
      reason: Real Web E2E creates test users through REST setup, fetches a per-user
        access_token with password grant, then logs in through Client.loginWithAgoraToken
        which maps to WebIM open({accessToken}).
    renewToken:
      real_e2e_status: supported
      tests:
      - tests/web_real/test_real_web_client_session.py::test_real_web_client_login_and_renew_with_user_access_token
