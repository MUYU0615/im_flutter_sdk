[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short
# 生成 HTML 报告（可选）：pytest --html=report.html --self-contained-html
markers =
    client: Client manager API tests
    chat: ChatManager API tests
    group: GroupManager / group API tests
    chatroom: ChatRoomManager API tests
    contact: ContactManager / friend API tests
    presence: PresenceManager / online status tests
    multi_device: tests requiring multiple devices/topics
    real_e2e: real SDK/service end-to-end coverage evidence
    wrapper_mapping: manager/cmd/info/result/event JSON wrapper mapping tests
    fixture: config, manifest, tool, or fixture tests that do not prove SDK capability
    capability: capability matrix and platform support status tests
    unit: pure unit tests for scripts/helpers
    web: Flutter Web test app cases
    android: Android target platform cases
    ios: iOS target platform cases
    agorachat1_4_0: AgoraChat 1.4.0 release coverage tests
    agorachat4_23_0: AgoraChat SDK 4.23.0 release coverage tests
    e2e_flow(name): topology interaction flow required by this case
    e2e_optional(*names): optional topology capabilities asserted when present
    disruptive_session: case changes login/session state and must be isolated
    requires_server_api: case requires REST/server API support
    requires_capability(name): case requires platform or SDK capability
